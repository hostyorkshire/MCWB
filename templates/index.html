<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCWB Dashboard</title>
    <style>
        :root {
            /* Light mode colors */
            --bg-gradient-start: #f0f4f8;
            --bg-gradient-end: #d9e2ec;
            --text-color: #1a1a1a;
            --text-secondary: #4a5568;
            --card-bg: rgba(255, 255, 255, 0.9);
            --card-border: rgba(0, 0, 0, 0.1);
            --accent-color: #2563eb;
            --tab-bg: rgba(241, 245, 249, 0.9);
            --tab-hover-bg: rgba(226, 232, 240, 0.9);
            --log-bg: #f8fafc;
            --log-border: rgba(0, 0, 0, 0.1);
            --log-hover: rgba(37, 99, 235, 0.1);
            --scrollbar-track: rgba(226, 232, 240, 0.5);
            --scrollbar-thumb: rgba(37, 99, 235, 0.4);
            --footer-text: #64748b;
            --shadow-color: rgba(0, 0, 0, 0.1);
        }

        [data-theme="dark"] {
            /* Dark mode colors */
            --bg-gradient-start: #000000;
            --bg-gradient-end: #0a0a0a;
            --text-color: #ffffff;
            --text-secondary: #94a3b8;
            --card-bg: rgba(20, 20, 20, 0.9);
            --card-border: rgba(255, 255, 255, 0.1);
            --accent-color: #60a5fa;
            --tab-bg: rgba(30, 30, 30, 0.8);
            --tab-hover-bg: rgba(45, 45, 45, 0.9);
            --log-bg: #0f0f0f;
            --log-border: rgba(255, 255, 255, 0.1);
            --log-hover: rgba(96, 165, 250, 0.1);
            --scrollbar-track: rgba(30, 41, 59, 0.3);
            --scrollbar-thumb: rgba(96, 165, 250, 0.4);
            --footer-text: #64748b;
            --shadow-color: rgba(0, 0, 0, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            color: var(--text-color);
            min-height: 100vh;
            padding: 20px;
            transition: background 0.3s ease, color 0.3s ease;
            font-size: 16px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px var(--shadow-color);
            border: 1px solid var(--card-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .header-content {
            flex: 1;
        }

        h1 {
            color: var(--text-color);
            font-size: 2.8em;
            margin-bottom: 10px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1.3em;
        }

        .theme-toggle {
            background: var(--tab-bg);
            border: 1px solid var(--card-border);
            color: var(--text-color);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1em;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .theme-toggle:hover {
            background: var(--tab-hover-bg);
            transform: translateY(-2px);
        }

        .status-card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 8px 32px var(--shadow-color);
            border: 1px solid var(--card-border);
        }

        .status-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .status-title {
            color: var(--text-color);
            font-size: 1.7em;
            font-weight: 600;
        }

        .status-badge {
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 1.1em;
            text-transform: uppercase;
        }

        .status-running {
            background: rgba(34, 197, 94, 0.2);
            color: #4ade80;
            border: 1px solid #4ade80;
        }

        .status-stopped {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            border: 1px solid #f87171;
        }

        .log-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .log-item {
            background: var(--tab-bg);
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid var(--accent-color);
        }

        .log-name {
            color: var(--text-color);
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 1.1em;
        }

        .log-info {
            color: var(--text-secondary);
            font-size: 1em;
        }

        .log-viewer {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 8px 32px var(--shadow-color);
            border: 1px solid var(--card-border);
        }

        .log-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .log-tab {
            padding: 14px 26px;
            background: var(--tab-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            cursor: pointer;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 1.05em;
            transition: all 0.3s ease;
        }

        .log-tab:hover {
            background: var(--tab-hover-bg);
            color: var(--accent-color);
        }

        .log-tab.active {
            background: rgba(96, 165, 250, 0.2);
            color: var(--accent-color);
            border-color: var(--accent-color);
        }

        .log-content {
            background: var(--log-bg);
            padding: 20px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 1em;
            max-height: 500px;
            overflow-y: auto;
            border: 1px solid var(--log-border);
        }

        .log-line {
            margin-bottom: 5px;
            line-height: 1.6;
            color: var(--text-color);
        }

        .log-line:hover {
            background: var(--log-hover);
        }

        .log-error {
            color: #f87171;
        }

        .log-warning {
            color: #fbbf24;
        }

        .log-info {
            color: var(--text-color);
        }

        .loading {
            text-align: center;
            color: var(--text-secondary);
            padding: 40px;
            font-size: 1.2em;
        }

        .refresh-btn {
            background: rgba(96, 165, 250, 0.2);
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1.05em;
            transition: all 0.3s ease;
        }

        .refresh-btn:hover {
            background: rgba(96, 165, 250, 0.3);
        }

        .footer {
            text-align: center;
            color: var(--footer-text);
            padding: 30px;
            font-size: 1em;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        ::-webkit-scrollbar-track {
            background: var(--scrollbar-track);
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb);
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(96, 165, 250, 0.6);
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }
            
            .log-grid {
                grid-template-columns: 1fr;
            }

            header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .theme-toggle {
                align-self: stretch;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <h1>🌤️ MCWB Dashboard</h1>
                <p class="subtitle">MeshCore Weather Bot - Real-time Monitoring</p>
            </div>
            <button class="theme-toggle" onclick="toggleTheme()" id="theme-toggle">
                <span id="theme-icon">🌙</span>
                <span id="theme-text">Dark Mode</span>
            </button>
        </header>

        <div class="status-card">
            <div class="status-header">
                <h2 class="status-title">System Status</h2>
                <span id="status-badge" class="status-badge status-stopped">Loading...</span>
            </div>
            <div class="log-grid" id="log-files">
                <div class="loading">Loading status...</div>
            </div>
        </div>

        <div class="log-viewer">
            <div class="status-header">
                <h2 class="status-title">Log Viewer</h2>
                <button class="refresh-btn" onclick="refreshLogs()">🔄 Refresh</button>
            </div>
            <div class="log-tabs">
                <div class="log-tab active" data-log="bot" onclick="switchLog('bot')">Bot Log</div>
                <div class="log-tab" data-log="bot_error" onclick="switchLog('bot_error')">Bot Errors</div>
                <div class="log-tab" data-log="meshcore" onclick="switchLog('meshcore')">MeshCore</div>
                <div class="log-tab" data-log="meshcore_error" onclick="switchLog('meshcore_error')">MeshCore Errors</div>
            </div>
            <div class="log-content" id="log-content">
                <div class="loading">Select a log to view...</div>
            </div>
        </div>

        <div class="footer">
            <p>MCWB v2 - MeshCore Weather Bot | Theme-Aware Dashboard</p>
            <p>Auto-refresh every 10 seconds</p>
        </div>
    </div>

    <script>
        let currentLog = 'bot';
        let autoRefreshInterval;

        // Theme management
        function initTheme() {
            // Check for saved theme preference or default to 'dark'
            const savedTheme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
            updateThemeButton(savedTheme);
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeButton(newTheme);
        }

        function updateThemeButton(theme) {
            const icon = document.getElementById('theme-icon');
            const text = document.getElementById('theme-text');
            
            if (theme === 'dark') {
                icon.textContent = '☀️';
                text.textContent = 'Light Mode';
            } else {
                icon.textContent = '🌙';
                text.textContent = 'Dark Mode';
            }
        }

        // Load status and logs on page load
        window.addEventListener('DOMContentLoaded', () => {
            initTheme();
            loadStatus();
            loadLog(currentLog);
            startAutoRefresh();
        });

        async function loadStatus() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();
                
                // Update status badge
                const badge = document.getElementById('status-badge');
                badge.textContent = data.status.toUpperCase();
                badge.className = `status-badge status-${data.status}`;
                
                // Update log files grid
                const logFilesDiv = document.getElementById('log-files');
                logFilesDiv.innerHTML = '';
                
                for (const [key, info] of Object.entries(data.logs)) {
                    const logItem = document.createElement('div');
                    logItem.className = 'log-item';
                    
                    const name = key.replace(/_/g, ' ').toUpperCase();
                    const size = info.exists ? formatBytes(info.size) : 'N/A';
                    const modified = info.modified || 'Never';
                    
                    // Create elements safely without innerHTML
                    const nameDiv = document.createElement('div');
                    nameDiv.className = 'log-name';
                    nameDiv.textContent = name;
                    
                    const sizeDiv = document.createElement('div');
                    sizeDiv.className = 'log-info';
                    sizeDiv.textContent = `Size: ${size}`;
                    
                    const modDiv = document.createElement('div');
                    modDiv.className = 'log-info';
                    modDiv.textContent = `Modified: ${modified}`;
                    
                    logItem.appendChild(nameDiv);
                    logItem.appendChild(sizeDiv);
                    logItem.appendChild(modDiv);
                    
                    logFilesDiv.appendChild(logItem);
                }
            } catch (error) {
                console.error('Error loading status:', error);
            }
        }

        async function loadLog(logType) {
            const logContent = document.getElementById('log-content');
            logContent.innerHTML = '<div class="loading">Loading logs...</div>';
            
            try {
                const response = await fetch(`/api/logs/${logType}`);
                const data = await response.json();
                
                if (data.lines && data.lines.length > 0) {
                    logContent.innerHTML = data.lines
                        .map(line => {
                            let className = 'log-line';
                            if (line.includes('ERROR') || line.includes('CRITICAL')) {
                                className += ' log-error';
                            } else if (line.includes('WARNING')) {
                                className += ' log-warning';
                            } else if (line.includes('INFO')) {
                                className += ' log-info';
                            }
                            return `<div class="${className}">${escapeHtml(line)}</div>`;
                        })
                        .join('');
                    
                    // Auto-scroll to bottom
                    logContent.scrollTop = logContent.scrollHeight;
                } else {
                    logContent.innerHTML = '<div class="loading">No log entries found</div>';
                }
            } catch (error) {
                console.error('Error loading log:', error);
                logContent.innerHTML = '<div class="loading">Error loading log</div>';
            }
        }

        function switchLog(logType) {
            currentLog = logType;
            
            // Update active tab
            document.querySelectorAll('.log-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelector(`[data-log="${logType}"]`).classList.add('active');
            
            // Load the log
            loadLog(logType);
        }

        function refreshLogs() {
            loadStatus();
            loadLog(currentLog);
        }

        function startAutoRefresh() {
            autoRefreshInterval = setInterval(() => {
                loadStatus();
                loadLog(currentLog);
            }, 10000); // Refresh every 10 seconds
        }

        function formatBytes(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
