# Netlify Configuration
# This file configures automatic deployment to Netlify when changes are pushed to GitHub

[build]
  # The website directory contains all the static HTML/CSS/JS files
  # No build command needed as this is a pure static site
  publish = "website"
  
  # No build command needed for static HTML site
  command = ""

# Production deployment configuration
[context.production]
  publish = "website"
  command = ""

# Branch-specific deployment (if you use different branches)
[context.deploy-preview]
  publish = "website"
  command = ""

# Branch deployment
[context.branch-deploy]
  publish = "website"
  command = ""

# Redirect rules (optional)
# Uncomment if you want to enable redirects
# [[redirects]]
#   from = "/*"
#   to = "/index.html"
#   status = 200

# Headers for security (optional but recommended)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
