[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcwb"
version = "2.0.0"
description = "MeshCore Weather Bot - Lightweight Python weather bot for MeshCore mesh networks"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "MIT"}
authors = [
    {name = "yourusername"}
]
keywords = ["meshtastic", "meshcore", "weather", "lora", "mesh-network", "raspberry-pi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "requests>=2.31.0",
    "pyserial>=3.5",
    "flask>=2.3.2",
    "flask-cors>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/MCWB"
Documentation = "https://mcwb.netlify.app"
Repository = "https://github.com/yourusername/MCWB"
Issues = "https://github.com/yourusername/MCWB/issues"

[tool.black]
line-length = 120
target-version = ['py37', 'py38', 'py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.git
  | __pycache__
  | build
  | dist
  | \.venv
  | venv
  | logs
)/
'''

[tool.isort]
profile = "black"
line_length = 120
